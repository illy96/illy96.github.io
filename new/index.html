    <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="container text-center">
    <h1>Simulatore del percorso dati del processore</h1>
    Questo simulatore contiene solo i registri e l'ALU, quindi il tuo compito è fare l'unità di controllo.

        <input id="runButton" onclick="executeCycle()" type="button" value="Esegui">
<!--        <input id="pauseButton" onclick="pauseCycle()" type="button" value="Pausa">-->
    </div>

    <div class="row align-items-start mt-5 mb-5 pt-2 pb-2">
        <b>Registri</b>
        <div class="col" id="bus_C_col"> <!-- C‑address dial -->
            <font color="green">Indirizzo bus C</font><br><br>
            <a href="javascript:turnKnob('sreg','CAddr',1);">
                <img id="CAddr" src="../sregDial0.gif"></a>
        </div>
        <div class="col"> <!-- REGISTER INPUTS (R0‑R3) -->
            <table id="input_reg">
                <tbody>
                <tr id="R0_row">
                    <td>
                        <label for="R0">R0:</label><input id="R0" type="text" value="0">
                    </td>
                </tr>
                <tr id="R1_row">
                    <td>
                        <label for="R1">R1:</label><input id="R1" type="text" value="0">
                    </td>
                </tr>
                <tr id="R2_row">
                    <td>
                        <label for="R2">R2:</label><input id="R2" type="text" value="0">
                    </td>
                </tr>
                <tr id="R3_row">
                    <td>
                        <label for="R3">R3:</label><input id="R3" type="text" value="0">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col" id="bus_A_col"> <!-- A‑address dial -->
            <font color="green">Indirizzo Bus A</font><br><br>
            <a href="javascript:turnKnob('sreg','AAddr',1)">
                <img alt="rotella bus A" id="AAddr" src="../sregDial0.gif"></a>
        </div>
        <div class="col" id="bus_B_col"> <!-- B‑address dial -->
            <font color="green">Indirizzo Bus B</font><br><br>
            <a href="javascript:turnKnob('sreg','BAddr',1);">
                <img alt="rotella bus B" id="BAddr" src="../sregDial0.gif"></a>
        </div>
    </div>

    <div class="mt-5 mb-5 pt-5 pb-5">
        <b>Unità Logico‑Aritmetica (ALU)</b>
        <br>
        <label for="ALU_A">A:</label><input id="ALU_A" type="text" value="0">
        <label for="ALU_B">B:</label><input id="ALU_B" type="text" value="0">
        <font color="green">Operazione dell'ALU</font>
        <br>
        <a href="javascript:turnKnob('salu','ALU',1);">
            <img id="ALU" src="../saluDial0.gif"></a><br>
        <label for="ALU_C" id="ALU_C_lab">C:</label><input id="ALU_C" type="text" value="0"><br> <!-- C‑address dial -->
    </div>


</div>
<script src="../anseki_leaderline/leader-line.min.js"></script>
<script src="index.js"></script>
</body>
</html>
