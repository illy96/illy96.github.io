<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Percorso dati del processore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Il percorso dati del processore</h1>
    <div class="d-flex justify-content-center">
        <div>
            <p><b>Registri</b></p>
        <table id="input_reg" border="0" cellspacing="0" cellpadding="0">

            <tbody><tr><td>
            <font color="white">R0:</font><input type="text" name="R0" size="16" maxlength="16" tabindex="1" onfocus="if(!CHANGE_ENABLED) blur();" onchange="registerChange(0);">
            </td></tr>
            <tr><td>
            <font color="white">R1:</font><input type="text" name="R1" size="16" maxlength="16" tabindex="2" onfocus="if(!CHANGE_ENABLED) blur();" onchange="registerChange(1);">
            </td></tr>
            <tr><td><font color="white">R2:</font><input type="text" name="R2" size="16" maxlength="16" tabindex="3" onfocus="if(!CHANGE_ENABLED) blur();" onchange="registerChange(2);">
            </td></tr>
            <tr><td><font color="white">R3:</font><input type="text" name="R3" size="16" maxlength="16" tabindex="4" onfocus="if(!CHANGE_ENABLED) blur();" onchange="registerChange(3);">
            </td></tr>
            </tbody>
        </table>
        </div>
    </div>  
    <script src="index.js"></script>
  </body>
</html>
