<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Percorso dati del processore</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet">
    <link href="minimal_css_design.css" rel="stylesheet">
    <link href="datapath.css" rel="stylesheet">
</head>
<body class="">
<div class="container-fluid text-center">
    <h1>Simulatore del percorso dati del processore</h1>
    <div class="d-none d-md-block">
        Questo simulatore contiene solo i registri e l'ALU, quindi il tuo compito è fare l'unità di controllo.
    </div>
    <div class="mb-4 mt-4 text-center" id="controls">

        Base numerica:
        <select id="numberBase" onchange="changeBase()">
            <option value="10">10</option>
            <option value="2">2</option>
<!--            <option value="2">16</option>-->
        </select>
        <br class="dp-ctrl-br">
        Velocità animazione:
        <select id="speed">
            <option>Lentissima</option>
            <option>Lenta</option>
            <option selected="selected">Media</option>
            <option>Veloce</option>
            <option>Velocissima</option>
        </select>
        <br class="dp-ctrl-br">
        <input id="runButton" onclick="executeCycle()" type="button" value="Esegui">
<!--        <input id="pauseButton" onclick="pauseCycle()" type="button" value="Pausa">-->
    </div>

    <!--
        Percorso dati: due pannelli (Registri e ALU); i bus sono disegnati in un SVG sovrapposto.
        Telefono/tablet: pannelli uno sopra l'altro, bus nei margini laterali (C a sinistra, A e B a destra).
        Computer (>= 1000px): le rotelle stanno accanto ai registri (C a sinistra, A e B a destra)
        e nel pannello Registri i bus corrono nelle corsie interne #lane_C e #lane_AB;
        il resto ha la stessa struttura del telefono.
    -->
    <div id="datapath">
        <svg id="bus_layer" aria-hidden="true"></svg>

        <fieldset class="dp-panel" id="reg_panel">
            <legend>Registri</legend>

            <div class="dp-body">
            <div class="dp-lane" id="lane_C"></div>
            <div class="dp-lane" id="lane_AB"></div>
            <div class="dp-dials">
                <div id="bus_C_col"> <!-- C‑address dial -->
                    <span class="dp-dial-label">Indirizzo bus C</span>
                    <a href="javascript:turnKnob('sreg','CAddr',1);">
                        <img alt="rotella bus C" id="CAddr" src="sregDial0.svg"></a>
                </div>
                <div id="bus_A_col"> <!-- A‑address dial -->
                    <span class="dp-dial-label">Indirizzo bus A</span>
                    <a href="javascript:turnKnob('sreg','AAddr',1)">
                        <img alt="rotella bus A" id="AAddr" src="sregDial0.svg"></a>
                </div>
                <div id="bus_B_col"> <!-- B‑address dial -->
                    <span class="dp-dial-label">Indirizzo bus B</span>
                    <a href="javascript:turnKnob('sreg','BAddr',1);">
                        <img alt="rotella bus B" id="BAddr" src="sregDial0.svg"></a>
                </div>
            </div>

            <div id="input_reg"> <!-- REGISTER INPUTS (R0‑R3) -->
                <div class="dp-field" id="R0_row">
                    <label for="R0">R0:</label>
                    <input class="form-control" id="R0" type="text" value="0">
                </div>
                <div class="dp-field" id="R1_row">
                    <label for="R1">R1:</label>
                    <input class="form-control" id="R1" type="text" value="0">
                </div>
                <div class="dp-field" id="R2_row">
                    <label for="R2">R2:</label>
                    <input class="form-control" id="R2" type="text" value="0">
                </div>
                <div class="dp-field" id="R3_row">
                    <label for="R3">R3:</label>
                    <input class="form-control" id="R3" type="text" value="0">
                </div>
            </div>
            </div>
        </fieldset>

        <fieldset class="dp-panel" id="alu_panel">
            <legend>Unità Logico‑Aritmetica (ALU)</legend>

            <div class="dp-body">
            <div class="dp-alu-inputs">
                <div class="dp-field" id="ALU_A_col">
                    <label for="ALU_A">A:</label>
                    <input class="form-control" id="ALU_A" type="text" value="0">
                </div>
                <div class="dp-field" id="ALU_B_col">
                    <label for="ALU_B">B:</label>
                    <input class="form-control" id="ALU_B" type="text" value="0">
                </div>
            </div>

            <div class="dp-alu-op">
                <span class="dp-dial-label">Operazione dell'ALU</span>
                <a href="javascript:turnKnob('salu','ALU',1);">
                    <img id="ALU" src="saluDial0.svg" alt="operazione ALU">
                </a>
            </div>

            <div class="dp-field" id="ALU_C_row">
                <label for="ALU_C" id="ALU_C_lab">C:</label>
                <input class="form-control" id="ALU_C" type="text" value="0">
            </div>
            </div>
        </fieldset>
    </div>

</div>
<script src="index.js"></script>
</body>
</html>
